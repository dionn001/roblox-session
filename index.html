<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Management Board</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0e12; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Navigation */
    .sidebar { width: 240px; background-color: #121319; border-right: 1px solid #1e2029; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { font-weight: bold; font-size: 18px; color: #fff; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
    .menu { list-style: none; }
    .menu li { padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; color: #8a8d9b; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .menu li:hover, .menu li.active { background-color: #1a1c24; color: #fff; }

    /* Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: radial-gradient(circle at top, #181528 0%, #0d0e12 50%); }
    .topbar { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    .search-bar { background: #181a20; border: 1px solid #262936; padding: 8px 16px; border-radius: 20px; color: #fff; font-size: 13px; width: 250px; }
    .user-profile { font-size: 14px; font-weight: bold; color: #fff; }

    /* Calendar Header */
    .calendar-days { display: flex; justify-content: center; gap: 12px; margin-top: 10px; margin-bottom: 30px; }
    .day-pill { background-color: #161821; border: 1px solid #232634; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; text-align: center; }
    .day-pill.active { background-color: #ff5e4d; color: white; border-color: #ff5e4d; font-weight: bold; }

    /* Content Area */
    .container { max-width: 900px; margin: 0 auto; width: 100%; padding: 0 20px; }
    .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-action h1 { font-size: 32px; font-weight: bold; }
    .btn-schedule { background-color: #ff5e4d; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-schedule:hover { background-color: #e04b3a; }

    /* Empty Box */
    .empty-card { background-color: #14151c; border: 1px solid #202330; border-radius: 12px; padding: 60px 20px; text-align: center; }
    .empty-icon { font-size: 40px; margin-bottom: 15px; color: #525666; }
    .empty-card p { color: #8a8d9b; font-size: 14px; margin-bottom: 20px; }

    /* Session List */
    .session-list { display: flex; flex-direction: column; gap: 12px; }
    .session-item { background: #161822; border: 1px solid #232635; padding: 16px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    .session-item h4 { color: #ff5e4d; font-size: 16px; margin-bottom: 4px; }
    .session-item p { color: #a0a5b5; font-size: 13px; }

    /* Modal Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal-content { background: #161822; padding: 30px; border-radius: 12px; width: 360px; border: 1px solid #2b2e3e; }
    .modal-content h3 { margin-bottom: 20px; color: #fff; }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 15px; background: #0d0e12; border: 1px solid #2b2e3e; color: #fff; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Sidebar Menu -->
  <div class="sidebar">
    <div>
      <div class="brand">⚡ SessionBoard</div>
      <ul class="menu">
        <li class="active">Dashboard</li>
        <li>Sessions</li>
        <li>Settings</li>
      </ul>
    </div>
  </div>

  <!-- Main View -->
  <div class="main-content">
    <div class="topbar">
      <input type="text" class="search-bar" placeholder="Search pages...">
      <div class="user-profile">Dionn001</div>
    </div>

    <div class="container">
      <!-- Calendar Bar -->
      <div class="calendar-days">
        <div class="day-pill">S<br>1</div>
        <div class="day-pill active">M<br>2</div>
        <div class="day-pill">T<br>3</div>
        <div class="day-pill">W<br>4</div>
        <div class="day-pill">T<br>5</div>
        <div class="day-pill">F<br>6</div>
        <div class="day-pill">S<br>7</div>
      </div>

      <!-- Header -->
      <div class="header-action">
        <h1>Today</h1>
        <button class="btn-schedule" onclick="openModal()">+ Schedule</button>
      </div>

      <!-- Content Area -->
      <div id="sessionContainer">
        <div class="empty-card">
          <div class="empty-icon">📅</div>
          <p>No sessions scheduled for this day.</p>
          <button class="btn-schedule" onclick="openModal()">+ Schedule One</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for adding a session -->
  <div class="modal" id="scheduleModal">
    <div class="modal-content">
      <h3>Schedule a Session</h3>
      <input type="text" id="hostInput" placeholder="Host Username (e.g. Dionn001)">
      <select id="typeInput">
        <option value="Training">Training</option>
        <option value="Tryout">Tryout</option>
        <option value="Shift">Shift</option>
        <option value="Patrol">Patrol</option>
      </select>
      <input type="text" id="timeInput" placeholder="Time (e.g. 20:00 CET)">
      <button class="btn-schedule" style="width: 100%;" onclick="submitSession()">Save Session</button>
      <button onclick="closeModal()" style="width: 100%; background: none; border: none; color: #8a8d9b; margin-top: 10px; cursor: pointer;">Cancel</button>
    </div>
  </div>

<script>
  function openModal() { document.getElementById('scheduleModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('scheduleModal').style.display = 'none'; }

  async function loadSessions() {
    try {
      const res = await fetch('/api/sessions');
      const sessions = await res.json();
      const container = document.getElementById('sessionContainer');

      if (sessions.length === 0) {
        container.innerHTML = `
          <div class="empty-card">
            <div class="empty-icon">📅</div>
            <p>No sessions scheduled for this day.</p>
            <button class="btn-schedule" onclick="openModal()">+ Schedule One</button>
          </div>
        `;
      } else {
        container.innerHTML = '<div class="session-list">' + sessions.map(s => `
          <div class="session-item">
            <div>
              <h4>${s.type}</h4>
              <p>Host: ${s.host}</p>
            </div>
            <div>
              <strong>${s.time}</strong>
            </div>
          </div>
        `).join('') + '</div>';
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function submitSession() {
    const host = document.getElementById('hostInput').value;
    const type = document.getElementById('typeInput').value;
    const time = document.getElementById('timeInput').value;

    if (!host || !time) return alert("Please fill in all fields!");

    await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, type, time })
    });

    closeModal();
    document.getElementById('hostInput').value = '';
    document.getElementById('timeInput').value = '';
    loadSessions();
  }

  loadSessions();
</script>
</body>
</html>
