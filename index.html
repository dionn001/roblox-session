<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Management Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a24;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #262838;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 350px;
    }
    h2 { text-align: center; color: #00a2ff; margin-bottom: 20px; }
    label { font-size: 14px; margin-top: 10px; display: block; color: #bbb; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1f2c;
      color: white;
      box-sizing: border-box;
    }
    button {
      background-color: #00a2ff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      border: none;
    }
    button:hover { background-color: #0082cc; }
    #message { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Host a Session</h2>
  
  <label for="host">Host Username:</label>
  <input type="text" id="host" placeholder="Enter your Roblox username">

  <label for="type">Session Type:</label>
  <select id="type">
    <option value="Training">Training</option>
    <option value="Tryout">Tryout</option>
    <option value="Shift">Shift</option>
    <option value="Patrol">Patrol</option>
  </select>

  <label for="time">Time (e.g. 20:00 CET):</label>
  <input type="text" id="time" placeholder="20:00 CET">

  <button onclick="postSession()">Schedule Session</button>

  <p id="message"></p>
</div>

<script>
  async function postSession() {
    const host = document.getElementById('host').value;
    const type = document.getElementById('type').value;
    const time = document.getElementById('time').value;
    const messageEl = document.getElementById('message');

    if (!host || !time) {
      messageEl.style.color = "red";
      messageEl.innerText = "Please fill in all fields!";
      return;
    }

    try {
      const response = await fetch('http://localhost:3000/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host, type, time, status: "Scheduled" })
      });

      const data = await response.json();
      if (data.success) {
        messageEl.style.color = "#00ff88";
        messageEl.innerText = "Session posted successfully!";
        document.getElementById('host').value = '';
        document.getElementById('time').value = '';
      }
    } catch (error) {
      messageEl.style.color = "red";
      messageEl.innerText = "Error connecting to server!";
    }
  }
</script>

</body>
</html>
